<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Searchable Diameter command, AVP, application, and result code definitions extracted from 3GPP specifications and RFCs, syntax-highlighted and cross-linked to their sources."
    />
    <!-- One colour, the stored theme's: theme.ts sets it, as the page follows no OS scheme. -->
    <meta name="theme-color" content="#e8e4d9" />
    <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
    <script>
      try {
        var t = localStorage.getItem('seanchai-theme');
      } catch (e) {}
      document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    </script>
    <title>Seanchaí</title>
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/layout.css" />
  </head>
  <body>
    <noscript><p>Seanchaí Explorer requires JavaScript.</p></noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
