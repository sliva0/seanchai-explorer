name: Deploy site

# Deploys only when run by hand.
on:
  workflow_dispatch:
    inputs:
      seanchai_git_ref:
        description: Install seanchai from this ref of its repository instead of PyPI
        required: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Set the repository variable, or the input above, to use a ref of the repository.
  SEANCHAI_GIT_REF: ${{ inputs.seanchai_git_ref || vars.SEANCHAI_GIT_REF }}
  SEANCHAI_REPOSITORY: https://github.com/sliva0/seanchai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # With no ref, the build runs what seanchai-release.json pins, through uvx: a PyPI release, or a commit of seanchai.
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # With a ref, the build runs the seanchai on PATH: the repository's two workspace packages at that ref.
      - name: Install seanchai from a ref
        if: env.SEANCHAI_GIT_REF != ''
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/seanchai"
          VIRTUAL_ENV="$RUNNER_TEMP/seanchai" uv pip install \
            "seanchai @ git+$SEANCHAI_REPOSITORY@$SEANCHAI_GIT_REF" \
            "seanchai-corpus @ git+$SEANCHAI_REPOSITORY@$SEANCHAI_GIT_REF#subdirectory=packages/seanchai-corpus"
          echo "$RUNNER_TEMP/seanchai/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      # The same checks as ci.yml, on the tree being published.
      - run: npm run test:build
      - name: Install Chromium
        run: |
          npx playwright-core install --with-deps --no-shell chromium
          echo "CHROMIUM=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      - run: npm run test:smoke
      - name: Build the public site
        run: npm run build
      - name: Check no PDF is published
        run: |
          if find dist -iname '*.pdf' | grep .; then exit 1; fi
      # One commit publishes one corpus: the pinned release's, unless a ref was asked for.
      - name: Check the export is the pinned release, and say what is published
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { SCHEMA_VERSION } from "./src/types.ts";
            import { pinText, release as pin } from "./scripts/seanchai.mjs";
            const index = JSON.parse(fs.readFileSync("dist/data/index.json", "utf8"));
            const published = `seanchai ${index.seanchai_version}, corpus ${index.corpus_version}`;
            const pinned = `seanchai ${pin.seanchai}, corpus ${pin["seanchai-corpus"]}`;
            const ref = process.env.SEANCHAI_GIT_REF;
            const from = ref ? `${process.env.SEANCHAI_REPOSITORY}@${ref}` : pinText();
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Publishing ${published}, export schema ${index.schema_version}, from ${from}\n`);
            if (index.schema_version !== SCHEMA_VERSION) {
              console.error(`The export is schema ${index.schema_version}, and the site reads schema ${SCHEMA_VERSION} only`);
              process.exit(1);
            }
            if (!ref && published !== pinned) {
              console.error(`The export is ${published}, and seanchai-release.json pins ${pinText()}`);
              process.exit(1);
            }
          '
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
